spring.application.name=e-commerce-api

# ================= PROFILE =================
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ================= SERVER =================
server.servlet.context-path=/api

# ================= CORS ===================
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# =========== DATABASE (PostgreSQL) ===========
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:3307/db_e_commerce}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ================= ORM (JPA/Hibernate) =================
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}

# Hiển thị câu lệnh SQL: chỉ bật qua profile (dev bật, prod tắt)
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Dùng tên column đúng như khai báo trong @Column(name=...), không tự lowercase
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
# Bắt buộc Hibernate quote tất cả identifier → PostgreSQL xử lý đúng "Id", "Email"...
spring.jpa.properties.hibernate.globally_quoted_identifiers=true

spring.jpa.open-in-view=false

# JWT — đọc từ biến môi trường, không hardcode
jwt.access-secret=${JWT_ACCESS_SECRET}
# 15 phút (ms)
jwt.access-expiration=${JWT_ACCESS_EXPIRATION:900000}
jwt.refresh-secret=${JWT_REFRESH_SECRET}
# 7 ngày (ms)
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# Cookie security — Secure=true trên HTTPS (prod), false trên dev
app.cookie.secure=${COOKIE_SECURE:false}

# Front-end URL for redirection
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# ================= OAUTH2 =================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.scope=profile,email
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}


# Swagger/OpenAPI — tắt theo mặc định, bật qua profile dev
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# LOGGING
spring.output.ansi.enabled=always
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR
