# ============================================================
# PRODUCTION PROFILE — chỉ áp dụng khi SPRING_PROFILES_ACTIVE=prod
# ============================================================

# Tắt SQL logging trong prod
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Tắt Swagger hoàn toàn trên prod
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Bắt buộc Secure cookie trên HTTPS
app.cookie.secure=true

# DDL: dùng validate thay vì update trên prod để tránh auto migration
spring.jpa.hibernate.ddl-auto=validate
